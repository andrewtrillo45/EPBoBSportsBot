name: EPBoBSportsBot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epbobsportsbot
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check feeds and post news
        env:
          WEBHOOKS: ${{ secrets.WEBHOOKS }}
        run: python epbobsportsbot.py

      - name: Save what was posted
        run: |
          git config user.name "EPBoBSportsBot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json sleeper_players.json 2>/dev/null || git add seen.json
          git diff --cached --quiet || (git commit -m "update seen stories" && (git push || (git pull --rebase && git push)))
