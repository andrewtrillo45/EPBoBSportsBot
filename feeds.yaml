# EPBoBSportsBot feed list
# Each channel key must match a key in your WEBHOOKS secret.
# To add a source, add another "- name / url" pair under that channel.
# "Google News" links search Google News; the site: ones pull a single outlet (Fox Sports, AP, RotoBaller, Underdog).
# If a source ever stops working, the bot skips it and keeps posting from the others.

settings:
  max_posts_per_channel_per_run: 4   # stops spam if lots of news drops at once
  max_age_hours: 24                  # ignore stories older than this
  first_run_posts: 1                 # on the very first run, only post the newest story per channel

# Sleeper "Trending" update: most added / most dropped players across Sleeper fantasy leagues.
# Posts into the channel named on the right, once every `every_hours`.
sleeper_trending:
  every_hours: 8
  lookback_hours: 24
  limit: 10
  sports:
    nfl: nfl        # Sleeper sport -> Discord channel
    nba: nba

channels:

