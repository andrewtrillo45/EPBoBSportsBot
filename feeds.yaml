# EPBoBSportsBot feed list
# Each channel key must match a key in your WEBHOOKS secret.
# To add a source, add another "- name / url" pair under that channel.
# "Google News" links search Google News; the site: ones pull a single outlet (Fox Sports, RotoBaller, Underdog).
# If a source ever stops working, the bot skips it and keeps posting from the others.

settings:
  max_posts_per_channel_per_run: 4   # gaming channels: max separate posts per run
  max_age_hours: 24                  # ignore stories older than this
  first_run_posts: 1                 # on the very first run, only post the newest story per channel
  # Never post titles containing these (forum threads, stat pages, etc.)
  exclude_keywords: ["EA Forums", "Forums", "Fortnite Stats", "Broadcast_"]

  # 🚨 IMPORTANT UPDATES — sports headlines with any of these words post right away,
  # on their own, in red, no matter how many there are (up to 15 every 5 min).
  priority_categories: [sports]
  max_priority_posts_per_run: 15
  priority_keywords:
    - injury
    - injured
    - injuries
    - absent
    - sidelined
    - day-to-day
    - did not practice
    - limited practice
    - DNP
    - upgraded
    - downgraded
    - ruled out
    - out for
    - questionable
    - doubtful
    - game-time decision
    - inactive
    - injured reserve
    - IR
    - placed on
    - activated
    - returns
    - return
    - will start
    - won't play
    - will not play
    - benched
    - starting
    - concussion
    - ACL
    - hamstring
    - ankle
    - knee
    - surgery
    - MRI
    - carted
    - trade
    - traded
    - trades
    - acquire
    - acquires
    - signs
    - signed
    - signing
    - extension
    - released
    - waived
    - cut
    - suspended
    - suspension
    - fired
    - hired
    - retires
    - retirement
    - breaking

  # 📰 ROUNDUP — everything else in sports channels is bundled into ONE message
  # with clickable headlines, instead of many separate posts.
  roundup_categories: [sports]
  roundup_every_minutes: 60
  roundup_max_stories: 10

# Sleeper "Trending" update: most added / most dropped players across Sleeper fantasy leagues.
# Posts into the channel named on the right, once every `every_hours`.
sleeper_trending:
  every_hours: 8
  lookback_hours: 24
  limit: 10
  sports:
    nfl: nfl        # Sleeper sport -> Discord channel
    nba: nba

